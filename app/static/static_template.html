<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>农田长势遥感监测与灌溉决策</title>
<meta name="description" content="Sentinel-2 时序物候提取 + 机器学习估产 + FAO-56 灌溉处方，离线自包含演示页" />
<style>/*__LEAFLET_CSS__*/</style>
<script>/*__LEAFLET_JS__*/</script>
<script>/*__CHART_JS__*/</script>
<style>
  :root { --bg:#0f1419; --panel:#171e26; --line:#27313d; --fg:#e6edf3; --dim:#8b98a5; --accent:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  .kpis { margin-left:auto; display:flex; gap:10px; flex-wrap:wrap; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:12px; color:var(--dim); min-width:98px; }
  .kpi b { display:block; font-size:17px; color:var(--fg); font-weight:600; }
  main { display:grid; grid-template-columns:1fr 430px; height:calc(100vh - 118px); }
  #map { width:100%; height:100%; background:#0b0f13; }
  aside { border-left:1px solid var(--line); overflow-y:auto; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .card h2 { margin:0 0 10px; font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
  .advice { font-size:15px; line-height:1.6; }
  .advice.bad { color:#ffb454; } .advice.good { color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:4px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--dim); font-size:12px; line-height:1.6; }
  canvas { max-height:210px; }
  footer { border-top:1px solid var(--line); padding:10px 20px; color:var(--dim); font-size:11px;
           display:flex; gap:16px; flex-wrap:wrap; }
  .legend { background:rgba(23,30,38,.92); border:1px solid var(--line); border-radius:8px;
            padding:8px 10px; font-size:11px; color:var(--fg); line-height:1.7; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .legend button { background:#0f1419; color:var(--fg); border:1px solid var(--line); border-radius:6px;
                   padding:3px 9px; font-size:11px; cursor:pointer; margin-top:4px; margin-right:4px; }
  .legend button.on { background:var(--accent); color:#0b0f13; border-color:var(--accent); font-weight:600; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } #map { height:52vh; } aside { border-left:none; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>农田长势遥感监测与灌溉决策</h1>
  <span class="sub">Sentinel-2 时序 &middot; 物候提取 &middot; 机器学习估产 &middot; FAO-56 灌溉处方</span>
  <div class="kpis">
    <div class="kpi">地块数<b id="kpi-plots">-</b></div>
    <div class="kpi">需灌溉<b id="kpi-need">-</b></div>
    <div class="kpi"><span id="kpi-ndvi-label">平均 NDVI</span><b id="kpi-ndvi">-</b></div>
    <div class="kpi">模型 R&sup2;<b id="kpi-r2">-</b></div>
  </div>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div class="card"><h2>选中地块</h2><div id="detail" class="muted">点击地图上的地块查看详情。</div></div>
    <div class="card"><h2>NDVI / NDRE 时间序列</h2><canvas id="chart-ts"></canvas><div id="ts-empty" class="muted"></div></div>
    <div class="card"><h2>根区水分平衡</h2><canvas id="chart-balance"></canvas></div>
    <div class="card"><h2>灌溉处方</h2><div id="plan" class="muted">选择地块后显示。</div></div>
    <div class="card"><h2>模型精度</h2><div id="metrics" class="muted"></div></div>
    <div class="card"><h2>特征重要性 Top 10</h2><canvas id="chart-imp"></canvas></div>
  </aside>
</main>
<footer>
  <span id="foot-meta"></span>
  <span>本页为自包含静态文件，数据已内联，无后端依赖</span>
</footer>

<script>
window.__AGRI_DATA__ = /*__AGRI_DATA__*/ null;

(function () {
  var D = window.__AGRI_DATA__ || {};
  var plots = D.plots || [];
  var tsAll = D.timeseries || {};
  var balAll = D.balance || {};
  var planAll = D.plan || {};
  var phenoAll = D.phenology || {};
  var tsChart = null, balChart = null, impChart = null;

  function fmt(v, d) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return '-';
    return Number(v).toFixed(d === undefined ? 1 : d);
  }
  function colorFor(n) {
    if (n === null || n === undefined || isNaN(n)) return '#5a6673';
    if (n < 0.25) return '#a50026';
    if (n < 0.40) return '#f46d43';
    if (n < 0.55) return '#fdae61';
    if (n < 0.70) return '#a6d96a';
    return '#1a9850';
  }
  function row(k, v) {
    return '<tr><td>' + k + '</td><td>' + (v === null || v === undefined || v === '' ? '-' : v) + '</td></tr>';
  }
  function byId(list, key) {
    var m = {};
    for (var i = 0; i < list.length; i++) m[String(list[i][key])] = list[i];
    return m;
  }

  // ---------------- 地图 ----------------
  var map = L.map('map', { zoomControl: true }).setView([36.3015, 116.1045], 14);
  var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Imagery &copy; Esri' });
  var carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { maxZoom: 20, attribution: '&copy; OpenStreetMap &copy; CARTO' });
  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
  esri.addTo(map);
  L.control.layers({ '卫星影像 (Esri)': esri, '深色底图 (CARTO)': carto, '街道 (OSM)': osm }, null, { position: 'topleft' }).addTo(map);

  var COLOR_MODES = {
    peak:   { field: 'ndvi_peak', label: '生长季峰值 NDVI' },
    latest: { field: 'ndvi',      label: '最新观测 NDVI' }
  };
  var colorMode = 'peak';

  function modeLabel() { return COLOR_MODES[colorMode].label; }
  function valueOf(p) {
    var v = p[COLOR_MODES[colorMode].field];
    if (v === undefined || v === null || v === '' || isNaN(v)) {
      // 生长季峰值缺失时退回最新观测
      v = p.ndvi;
    }
    return (v === undefined || v === null || v === '' || isNaN(v)) ? null : Number(v);
  }

  // 直接用变量持有两个面板的 DOM 引用。
  // 别用 document.querySelectorAll('.legend')[n] 这种按下标取法——
  // Leaflet 的控件插入顺序不保证和创建顺序一致，下标会错位。
  var legendDiv = null;
  var modeDiv = null;

  var legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    legendDiv = div;
    var stops = [[0.70, '#1a9850', '0.70+'], [0.55, '#a6d96a', '0.55-0.70'],
                 [0.40, '#fdae61', '0.40-0.55'], [0.25, '#f46d43', '0.25-0.40'],
                 [0, '#a50026', '&lt;0.25']];
    div.innerHTML = '<b>' + modeLabel() + '</b><br/>' + stops.map(function (s) {
      return '<i style="background:' + s[1] + '"></i>' + s[2];
    }).join('<br/>');
    return div;
  };
  legend.addTo(map);

  var modeCtl = L.control({ position: 'topright' });
  modeCtl.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    modeDiv = div;
    div.innerHTML = '<b>着色依据</b><br/>' +
      '<button data-mode="peak">生长季峰值</button>' +
      '<button data-mode="latest">最新观测</button>' +
      '<div class="muted" style="margin-top:4px;max-width:150px;line-height:1.5">' +
      '成熟后期各块地 NDVI 都掉到 0.1 上下，<br/>要看长势差异得用生长季峰值。</div>';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    div.querySelectorAll('button').forEach(function (btn) {
      btn.onclick = function () {
        colorMode = btn.getAttribute('data-mode');
        restyle();
      };
    });
    return div;
  };
  modeCtl.addTo(map);

  var layer = null;
  var gj = D.geojson;
  if (gj && gj.features && gj.features.length) {
    layer = L.geoJSON(gj, {
      style: function (f) {
        return { color: '#ffffff', weight: 1.5, fillColor: colorFor(valueOf(f.properties)), fillOpacity: 0.75 };
      },
      onEachFeature: function (f, lyr) {
        var p = f.properties;
        lyr.bindTooltip(p.plot_id + ' &middot; NDVI ' + fmt(valueOf(p), 3), { sticky: true });
        lyr.on('click', function () { selectPlot(p.plot_id, p); });
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds().pad(0.25));
  } else {
    document.getElementById('detail').innerHTML = '没有找到地块数据，请先运行 <b>python -m src.pipeline</b>。';
  }

  // ---------------- 重新着色 ----------------
  function restyle() {
    if (!layer) return;
    layer.setStyle(function (f) {
      return { color: '#ffffff', weight: 1.5, fillColor: colorFor(valueOf(f.properties)), fillOpacity: 0.75 };
    });
    layer.eachLayer(function (l) {
      l.setTooltipContent(l.feature.properties.plot_id + ' &middot; NDVI ' + fmt(valueOf(l.feature.properties), 3));
    });
    if (legendDiv) {
      var t = legendDiv.querySelector('b');
      if (t) t.textContent = modeLabel();
    }
    if (modeDiv) {
      modeDiv.querySelectorAll('button').forEach(function (b) {
        b.className = (b.getAttribute('data-mode') === colorMode) ? 'on' : '';
      });
    }
    updateKpi();
  }

  // ---------------- KPI ----------------
  function updateKpi() {
    var valid = plots.filter(function (p) { return valueOf(p) !== null; });
    document.getElementById('kpi-plots').textContent = plots.length;
    document.getElementById('kpi-need').textContent = plots.filter(function (p) { return p.needs_irrigation; }).length;
    document.getElementById('kpi-ndvi').textContent = valid.length
      ? (valid.reduce(function (s, p) { return s + valueOf(p); }, 0) / valid.length).toFixed(3)
      : '-';
    var lbl = document.getElementById('kpi-ndvi-label');
    if (lbl) lbl.textContent = colorMode === 'peak' ? '生长季峰值 NDVI' : '最新观测 NDVI';
  }
  updateKpi();
  var M = D.metrics || {};
  if (M.cv && M.cv.R2 !== undefined) document.getElementById('kpi-r2').textContent = Number(M.cv.R2).toFixed(2);

  document.getElementById('foot-meta').textContent =
    '数据生成时间：' + (D.meta && D.meta.generated_at ? D.meta.generated_at : '未知') +
    ' | 地块 ' + plots.length + ' 个 | 样本 ' + (M.n_samples || '-') + ' 条';

  // ---------------- 详情 ----------------
  function selectPlot(plotId, props) {
    var need = props.needs_irrigation;
    var html = '<div style="font-size:15px;font-weight:600;margin-bottom:8px">' + plotId + '</div>';
    html += '<div class="advice ' + (need ? 'bad' : 'good') + '">' + (props.advice || '暂无灌溉建议') + '</div>';
    html += '<table>' +
      row('观测日期', props.date) +
      row('最新观测 NDVI', fmt(props.ndvi, 3)) +
      row('生长季峰值 NDVI', fmt(props.ndvi_peak, 3)) +
      row('作物系数 Kc', fmt(props.kc, 3)) +
      row('日需水 ETc', fmt(props.etc_mm_per_day, 2) + ' mm/d') +
      row('根区亏缺 Dr', fmt(props.dr_mm, 1) + ' mm') +
      row('总可用水 TAW', fmt(props.taw_mm, 1) + ' mm') +
      row('允许亏缺 RAW', fmt(props.raw_mm, 1) + ' mm') +
      row('亏缺率 Dr/TAW', fmt(props.dr_ratio * 100, 1) + ' %') +
      row('建议毛灌溉量', fmt(props.irrigation_gross_mm, 1) + ' mm') +
      '</table>';
    document.getElementById('detail').innerHTML = html;

    var ph = phenoAll[plotId];
    if (ph && ph.length) {
      var last = ph[ph.length - 1];
      document.getElementById('detail').innerHTML += '<table style="margin-top:8px">' +
        row('返青期 SOS', last.SOS) + row('峰值期 POS', last.POS) +
        row('成熟期 EOS', last.EOS) + row('生长季长度', fmt(last.LOS, 0) + ' 天') +
        row('生长季累积', fmt(last.NDVI_integral, 1) + ' NDVI·d') + '</table>';
    }
    drawTimeseries(plotId);
    drawBalance(plotId);
    renderPlan(plotId);
  }

  function chartOpts(yTitle) {
    return {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#8b98a5', boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: '#8b98a5', maxTicksLimit: 6, font: { size: 10 } }, grid: { color: '#27313d' } },
        y: { title: { display: true, text: yTitle, color: '#8b98a5', font: { size: 11 } },
             ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { color: '#27313d' } }
      }
    };
  }

  function drawTimeseries(plotId) {
    var rows = tsAll[plotId] || [];
    var empty = document.getElementById('ts-empty');
    empty.textContent = rows.length ? '' : '该地块没有时序数据。';
    if (tsChart) { tsChart.destroy(); tsChart = null; }
    if (!rows.length) return;
    tsChart = new Chart(document.getElementById('chart-ts'), {
      type: 'line',
      data: {
        labels: rows.map(function (r) { return String(r.date).slice(0, 10); }),
        datasets: [
          { label: 'NDVI', data: rows.map(function (r) { return r.NDVI; }), borderColor: '#3fb950',
            backgroundColor: 'rgba(63,185,80,.15)', tension: .3, pointRadius: rows.length > 40 ? 0 : 2, borderWidth: 2 },
          { label: 'NDRE', data: rows.map(function (r) { return r.NDRE; }), borderColor: '#58a6ff',
            tension: .3, pointRadius: 0, borderWidth: 1.5, borderDash: [4, 3] }
        ]
      },
      options: chartOpts('指数')
    });
  }

  function drawBalance(plotId) {
    var rows = balAll[plotId] || [];
    if (balChart) { balChart.destroy(); balChart = null; }
    if (!rows.length) return;
    balChart = new Chart(document.getElementById('chart-balance'), {
      type: 'line',
      data: {
        labels: rows.map(function (r) { return String(r.date).slice(0, 10); }),
        datasets: [
          { label: '根区亏缺 Dr (mm)', data: rows.map(function (r) { return r.dr_mm; }),
            borderColor: '#ffb454', backgroundColor: 'rgba(255,180,84,.15)', tension: .25,
            pointRadius: 0, borderWidth: 2, fill: true },
          { label: 'RAW (mm)', data: rows.map(function (r) { return r.raw_mm; }),
            borderColor: '#f85149', borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0 }
        ]
      },
      options: chartOpts('mm')
    });
  }

  function renderPlan(plotId) {
    var rows = planAll[plotId] || [];
    var el = document.getElementById('plan');
    if (!rows.length) { el.innerHTML = '<span class="muted">该地块在统计窗口内没有灌溉事件。</span>'; return; }
    var trs = rows.slice(-8).map(function (r) {
      return row(String(r.date).slice(0, 10), fmt(r.irrigation_gross_mm, 1) + ' mm');
    }).join('');
    el.innerHTML = '<table>' + trs + '</table><div class="muted" style="margin-top:8px">' +
      '共 ' + rows.length + ' 次灌溉事件，累计毛灌溉量 ' +
      fmt(rows.reduce(function (s, r) { return s + Number(r.irrigation_gross_mm || 0); }, 0), 0) + ' mm</div>';
  }

  // ---------------- 精度与重要性 ----------------
  (function renderMetrics() {
    var el = document.getElementById('metrics');
    if (!M || !M.available && !M.task) { el.innerHTML = '没有模型结果。'; return; }
    var cv = M.cv || {}, ho = M.holdout || {};
    var html = '<table>' +
      row('任务 / 目标', (M.task || '-') + ' / ' + (M.target || '-')) +
      row('样本数', M.n_samples) + row('特征数', M.n_features) +
      row('分组字段', M.group_col) +
      row('交叉验证 R&sup2;', fmt(cv.R2, 3)) +
      row('交叉验证 RMSE', fmt(cv.RMSE, 3)) +
      row('交叉验证 nRMSE', cv.nRMSE_pct ? fmt(cv.nRMSE_pct, 1) + ' %' : '-');
    if (ho && ho.R2 !== undefined) {
      html += row('留出年 R&sup2;', fmt(ho.R2, 3)) + row('留出年 RMSE', fmt(ho.RMSE, 3));
    }
    html += '</table><div class="muted" style="margin-top:8px">按 ' + (M.group_col || 'year') +
            ' 分组交叉验证，避免同一地块相邻年份互相泄漏。</div>';
    el.innerHTML = html;
  })();

  (function drawImportance() {
    var rows = (D.importance || []).slice(0, 10).reverse();
    if (!rows.length) return;
    impChart = new Chart(document.getElementById('chart-imp'), {
      type: 'bar',
      data: { labels: rows.map(function (r) { return r.feature; }),
              datasets: [{ data: rows.map(function (r) { return r.importance; }), backgroundColor: '#58a6ff' }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { color: '#27313d' } },
                  y: { ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { display: false } } }
      }
    });
  })();

  if (plots.length) selectPlot(plots[0].plot_id, plots[0]);
  restyle();
})();
</script>
</body>
</html>
