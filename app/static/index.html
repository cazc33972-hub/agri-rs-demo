<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>农田长势遥感监测与灌溉决策</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1419; --panel:#171e26; --line:#27313d; --fg:#e6edf3; --dim:#8b98a5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
         background: var(--bg); color: var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  .kpis { margin-left:auto; display:flex; gap:10px; flex-wrap:wrap; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:8px;
         padding:6px 12px; font-size:12px; color:var(--dim); min-width:96px; }
  .kpi b { display:block; font-size:17px; color:var(--fg); font-weight:600; }
  main { display:grid; grid-template-columns: 1fr 420px; height: calc(100vh - 61px); }
  #map { width:100%; height:100%; }
  aside { border-left:1px solid var(--line); overflow-y:auto; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:14px; margin-bottom:14px; }
  .card h2 { margin:0 0 10px; font-size:13px; color:var(--dim); font-weight:600;
             letter-spacing:.04em; text-transform:uppercase; }
  .advice { font-size:15px; line-height:1.6; }
  .advice.bad { color:#ffb454; }
  .advice.good { color:#6fcf97; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:4px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric: tabular-nums; }
  .muted { color:var(--dim); font-size:12px; line-height:1.6; }
  canvas { max-height:220px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px;
         border:1px solid var(--line); color:var(--dim); margin-left:6px; }
</style>
</head>
<body>
<header>
  <h1>农田长势遥感监测与灌溉决策</h1>
  <span class="sub">Sentinel-2 时序 &middot; 物候提取 &middot; 机器学习估产 &middot; FAO-56 灌溉处方</span>
  <div class="kpis">
    <div class="kpi">地块数<b id="kpi-plots">-</b></div>
    <div class="kpi">需灌溉<b id="kpi-need">-</b></div>
    <div class="kpi">当前平均 NDVI<b id="kpi-ndvi">-</b></div>
  </div>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div class="card">
      <h2>选中地块</h2>
      <div id="detail" class="muted">点击地图上的地块查看详情。</div>
    </div>
    <div class="card">
      <h2>NDVI 时间序列</h2>
      <canvas id="chart-ts"></canvas>
    </div>
    <div class="card">
      <h2>根区水分平衡</h2>
      <canvas id="chart-balance"></canvas>
    </div>
    <div class="card">
      <h2>模型精度</h2>
      <div id="metrics" class="muted">加载中...</div>
    </div>
    <div class="card">
      <h2>特征重要性 Top 10</h2>
      <canvas id="chart-imp"></canvas>
    </div>
  </aside>
</main>
<script>
var API = window.location.origin;
var map = L.map('map').setView([36.3015, 116.1045], 14);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Imagery &copy; Esri' }).addTo(map);

var tsChart = null, balChart = null, impChart = null;
var layer = null;

function colorFor(ndvi) {
  if (ndvi === null || ndvi === undefined || isNaN(ndvi)) return '#666';
  if (ndvi < 0.25) return '#a50026';
  if (ndvi < 0.40) return '#f46d43';
  if (ndvi < 0.55) return '#fdae61';
  if (ndvi < 0.70) return '#a6d96a';
  return '#1a9850';
}

function fmt(v, digits) {
  if (v === null || v === undefined || v === '' || isNaN(v)) return '-';
  return Number(v).toFixed(digits === undefined ? 1 : digits);
}

function getJSON(url) {
  return fetch(API + url).then(function (r) { return r.ok ? r.json() : null; })
                         .catch(function () { return null; });
}

// ---------------- 地图 ----------------
function loadPlots() {
  getJSON('/api/plots').then(function (gj) {
    if (!gj || !gj.features || !gj.features.length) {
      document.getElementById('detail').innerHTML =
        '没有 plots.geojson。请先跑 <b>python -m src.pipeline</b>。';
      return;
    }
    layer = L.geoJSON(gj, {
      style: function (f) {
        return { color: '#ffffff', weight: 1.5, fillColor: colorFor(f.properties.ndvi),
                 fillOpacity: 0.75 };
      },
      onEachFeature: function (f, lyr) {
        var p = f.properties;
        lyr.bindTooltip(p.plot_id + ' &middot; NDVI ' + fmt(p.ndvi, 3), { sticky: true });
        lyr.on('click', function () { selectPlot(p.plot_id, p); });
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds().pad(0.2));

    var feats = gj.features.map(function (f) { return f.properties; });
    var valid = feats.filter(function (p) { return p.ndvi !== null && p.ndvi !== undefined; });
    document.getElementById('kpi-plots').textContent = feats.length;
    document.getElementById('kpi-need').textContent =
      feats.filter(function (p) { return p.needs_irrigation; }).length;
    if (valid.length) {
      var mean = valid.reduce(function (s, p) { return s + Number(p.ndvi); }, 0) / valid.length;
      document.getElementById('kpi-ndvi').textContent = mean.toFixed(3);
    }
  });
}

// ---------------- 详情 ----------------
function selectPlot(plotId, props) {
  var need = props.needs_irrigation;
  var html = '<div style="font-size:15px;font-weight:600;margin-bottom:8px">' + plotId + '</div>';
  html += '<div class="advice ' + (need ? 'bad' : 'good') + '">' +
          (props.advice || '暂无灌溉建议') + '</div>';
  html += '<table>' +
    row('最新日期', props.date) +
    row('NDVI', fmt(props.ndvi, 3)) +
    row('作物系数 Kc', fmt(props.kc, 3)) +
    row('日需水 ETc', fmt(props.etc_mm_per_day, 2) + ' mm/d') +
    row('根区亏缺 Dr', fmt(props.dr_mm, 1) + ' mm') +
    row('总可用水 TAW', fmt(props.taw_mm, 1) + ' mm') +
    row('管理允许亏缺 RAW', fmt(props.raw_mm, 1) + ' mm') +
    row('亏缺率 Dr/TAW', fmt(props.dr_ratio * 100, 1) + ' %') +
    row('建议毛灌溉量', fmt(props.irrigation_gross_mm, 1) + ' mm') +
    '</table>';
  document.getElementById('detail').innerHTML = html;

  loadTimeseries(plotId);
  loadBalance(plotId);
}

function row(k, v) {
  return '<tr><td>' + k + '</td><td>' + (v === null || v === undefined ? '-' : v) + '</td></tr>';
}

function loadTimeseries(plotId) {
  getJSON('/api/timeseries/' + encodeURIComponent(plotId)).then(function (rows) {
    if (!rows || !rows.length) { if (tsChart) { tsChart.destroy(); tsChart = null; } return; }
    var labels = rows.map(function (r) { return String(r.date).slice(0, 10); });
    var ndvi = rows.map(function (r) { return r.NDVI; });
    var ndre = rows.map(function (r) { return r.NDRE; });
    var ctx = document.getElementById('chart-ts');
    if (tsChart) tsChart.destroy();
    tsChart = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [
        { label: 'NDVI', data: ndvi, borderColor: '#3fb950', backgroundColor: 'rgba(63,185,80,.15)',
          tension: .3, pointRadius: rows.length > 40 ? 0 : 2, borderWidth: 2 },
        { label: 'NDRE', data: ndre, borderColor: '#58a6ff', backgroundColor: 'transparent',
          tension: .3, pointRadius: 0, borderWidth: 1.5, borderDash: [4, 3] }
      ]},
      options: chartOpts({ yTitle: '指数' })
    });
  });
}

function loadBalance(plotId) {
  getJSON('/api/balance/' + encodeURIComponent(plotId)).then(function (rows) {
    if (!rows || !rows.length) { if (balChart) { balChart.destroy(); balChart = null; } return; }
    var labels = rows.map(function (r) { return String(r.date).slice(0, 10); });
    var ctx = document.getElementById('chart-balance');
    if (balChart) balChart.destroy();
    balChart = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [
        { label: '根区亏缺 Dr (mm)', data: rows.map(function (r) { return r.dr_mm; }),
          borderColor: '#ffb454', backgroundColor: 'rgba(255,180,84,.15)',
          tension: .25, pointRadius: 0, borderWidth: 2, fill: true },
        { label: 'RAW (mm)', data: rows.map(function (r) { return r.raw_mm; }),
          borderColor: '#f85149', borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0 }
      ]},
      options: chartOpts({ yTitle: 'mm' })
    });
  });
}

function chartOpts(extra) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { labels: { color: '#8b98a5', boxWidth: 12, font: { size: 11 } } } },
    scales: {
      x: { ticks: { color: '#8b98a5', maxTicksLimit: 6, font: { size: 10 } },
           grid: { color: '#27313d' } },
      y: { title: { display: true, text: extra.yTitle, color: '#8b98a5', font: { size: 11 } },
           ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { color: '#27313d' } }
    }
  };
}

// ---------------- 精度与重要性 ----------------
function loadMetrics() {
  getJSON('/api/metrics').then(function (m) {
    var el = document.getElementById('metrics');
    if (!m || !m.available) {
      el.innerHTML = '暂无模型结果。放好 <b>data/raw/ground_truth.csv</b> 后重跑管线。';
      return;
    }
    var cv = m.cv || {}, ho = m.holdout || {};
    var html = '<table>' +
      row('任务 / 目标', (m.task || '-') + ' / ' + (m.target || '-')) +
      row('样本数', m.n_samples) +
      row('特征数', m.n_features) +
      row('分组字段', m.group_col) +
      row('交叉验证 R²', fmt(cv.R2, 3)) +
      row('交叉验证 RMSE', fmt(cv.RMSE, 3)) +
      row('交叉验证 nRMSE', cv.nRMSE_pct ? fmt(cv.nRMSE_pct, 1) + ' %' : '-');
    if (ho && ho.R2 !== undefined) {
      html += row('留出年 R² (' + (m.holdout_years || []).join(',') + ')', fmt(ho.R2, 3)) +
              row('留出年 RMSE', fmt(ho.RMSE, 3));
    }
    html += '</table>';
    html += '<div class="muted" style="margin-top:8px">按 ' + (m.group_col || 'year') +
            ' 分组交叉验证，避免同一地块相邻年份互相泄漏。</div>';
    el.innerHTML = html;
  });
}

function loadImportance() {
  getJSON('/api/importance').then(function (rows) {
    if (!rows || !rows.length) return;
    rows = rows.slice(0, 10).reverse();
    var ctx = document.getElementById('chart-imp');
    if (impChart) impChart.destroy();
    impChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: rows.map(function (r) { return r.feature; }),
              datasets: [{ data: rows.map(function (r) { return r.importance; }),
                           backgroundColor: '#58a6ff' }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { color: '#27313d' } },
          y: { ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { display: false } }
        }
      }
    });
  });
}

loadPlots();
loadMetrics();
loadImportance();
</script>
</body>
</html>
