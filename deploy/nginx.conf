# 静态演示页的 nginx 配置。
# 用法：cp deploy/nginx.conf /etc/nginx/conf.d/agri.conf && nginx -t && systemctl reload nginx

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 单文件页面也要开 gzip：713 KB 的 HTML 压完大约 150 KB，国内首屏差别很明显
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/html text/css application/javascript application/json
                      image/svg+xml application/geo+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，重新发布后立刻生效；静态资源可以长缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(js|css|png|svg|geojson|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 如果以后要同时跑 FastAPI（方案 B），把下面这段放开
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:8000;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_read_timeout 120s;
    # }

    add_header X-Content-Type-Options nosniff;
}
